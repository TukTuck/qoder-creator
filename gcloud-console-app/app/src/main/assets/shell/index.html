<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5c63">
  <title>Console Pocket</title>
  <link rel="stylesheet" href="shell.css">
</head>
<!--
  Lokales Shell-Skeleton (PLAN, Schicht L3 / Meilenstein M5).
  Wird ueber androidx.webkit.WebViewAssetLoader unter
  https://appassets.androidplatform.net/shell/index.html ausgeliefert.

  Zweck:
  1. Sofort sichtbare UI ohne ein einziges Byte Netzwerk (< 300 ms nach Kaltstart).
  2. Offline-/Fehlerzustand mit erklaerendem Hinweis statt Chromium-Fehlerseite.

  Parameter (per Query-String): ?mode=loading|offline|error&detail=<text>
  Diese Seite enthaelt KEIN JavaScript, das in Google-Seiten eingreift, und keine
  echten Daten - nur Platzhalter.
-->
<body data-mode="loading">
  <header class="topbar">
    <div class="icon-btn skeleton-block"></div>
    <div class="brand">Console&nbsp;Pocket</div>
    <div class="project-chip skeleton-block"></div>
    <div class="search skeleton-block"></div>
    <div class="icon-btn skeleton-block"></div>
    <div class="avatar skeleton-block"></div>
  </header>

  <main class="body">
    <nav class="rail">
      <div class="rail-item skeleton-block"></div>
      <div class="rail-item skeleton-block"></div>
      <div class="rail-item skeleton-block"></div>
      <div class="rail-item skeleton-block"></div>
      <div class="rail-item skeleton-block"></div>
      <div class="rail-item skeleton-block"></div>
    </nav>

    <section class="content">
      <div class="card">
        <div class="line w60 skeleton-block"></div>
        <div class="line w90 skeleton-block"></div>
        <div class="line w75 skeleton-block"></div>
      </div>
      <div class="grid">
        <div class="tile"><div class="line w60 skeleton-block"></div><div class="big skeleton-block"></div></div>
        <div class="tile"><div class="line w60 skeleton-block"></div><div class="big skeleton-block"></div></div>
        <div class="tile"><div class="line w60 skeleton-block"></div><div class="big skeleton-block"></div></div>
        <div class="tile"><div class="line w60 skeleton-block"></div><div class="big skeleton-block"></div></div>
      </div>
      <div class="card">
        <div class="line w40 skeleton-block"></div>
        <div class="row skeleton-block"></div>
        <div class="row skeleton-block"></div>
        <div class="row skeleton-block"></div>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <span class="dot"></span>
    <span id="status-text">Gespeicherte UI geladen &middot; Console wird aufgebaut &hellip;</span>
  </footer>
</body>
</html>
